[project]
name = "langchain_project"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "daiche", email = "2592328108@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "langchain>=1.4.9",
    "langchain-deepseek>=1.1.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langgraph-checkpoint>=4.3.1",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
    "uv",
]

[project.scripts]
langchain_project = "langchain_project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
